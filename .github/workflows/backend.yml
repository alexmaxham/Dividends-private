name: Deploy backend

# Tests the Cloud Functions and Firestore rules on the emulator, then deploys them to Firebase.
# Deploys only once these are set in the repository's Settings → Secrets and variables → Actions:
#   Variable  FIREBASE_PROJECT_ID         the Firebase project ID
#   Secret    FIREBASE_SERVICE_ACCOUNT    JSON key of a service account allowed to deploy (see README)
#   Secrets   PLAID_CLIENT_ID, PLAID_SECRET   copied into Google Secret Manager on each deploy
#   Optional secrets  MARKET_API_KEY, FINNHUB_API_KEY, RESEND_API_KEY, VAPID_PRIVATE_KEY  (features stay off without them)
#   Optional variables  VAPID_PUBLIC_KEY, EMAIL_FROM
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firestore.rules', 'firestore.indexes.json', 'firebase.json', '.github/workflows/backend.yml']
  pull_request:
    paths: ['functions/**', 'firestore.rules', 'firestore.indexes.json', 'firebase.json', '.github/workflows/backend.yml']
  workflow_dispatch:

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:emulator

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Check setup
        id: ready
        run: |
          if [ -z "$PROJECT" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Backend not deployed: set the FIREBASE_PROJECT_ID variable and FIREBASE_SERVICE_ACCOUNT secret (see README)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v5
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
        working-directory: functions
      - if: steps.ready.outputs.go == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Store keys in Secret Manager
        if: steps.ready.outputs.go == 'true'
        env:
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          MARKET_API_KEY: ${{ secrets.MARKET_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          set_secret() { printf '%s' "$2" | npx --prefix functions firebase functions:secrets:set "$1" --data-file - --project "$PROJECT" --non-interactive --force; }
          for name in PLAID_CLIENT_ID PLAID_SECRET; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::warning::$name isn't set as a repository secret; keeping the value already in Secret Manager."; continue; fi
            set_secret "$name" "$value"
          done
          # Optional features. A function can't deploy without its secret, so a missing one gets the placeholder
          # "none", which the functions treat as "turned off".
          for name in MARKET_API_KEY FINNHUB_API_KEY RESEND_API_KEY VAPID_PRIVATE_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then set_secret "$name" "$value"; continue; fi
            if npx --prefix functions firebase functions:secrets:access "$name" --project "$PROJECT" > /dev/null 2>&1; then continue; fi
            echo "::notice::$name isn't set; that feature stays off until you add it (see README)."
            set_secret "$name" none
          done
      - name: Pass optional settings to the functions
        if: steps.ready.outputs.go == 'true'
        env:
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
        run: |
          # Replace the line in functions/.env (each setting must appear there exactly once).
          setenv() { v=$(printf '%s' "$2" | sed 's/[&|\\]/\\&/g'); sed -i "s|^$1=.*|$1=$v|" functions/.env; }
          if [ -n "$VAPID_PUBLIC_KEY" ]; then setenv VAPID_PUBLIC_KEY "$VAPID_PUBLIC_KEY"; fi
          if [ -n "$EMAIL_FROM" ]; then setenv EMAIL_FROM "\"$EMAIL_FROM\""; fi
      - name: Deploy rules and functions
        if: steps.ready.outputs.go == 'true'
        run: npx --prefix functions firebase deploy --only firestore,functions --project "$PROJECT" --non-interactive --force
